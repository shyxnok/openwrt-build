name: Build OpenWrt (ImageBuilder — Fast)

# =============================================================================
# Official ImageBuilder workflow — downloads the ImageBuilder archive from
# downloads.openwrt.org and assembles firmware with your chosen packages.
# No third-party action dependency. Duration: 10–20 minutes.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本'
        required: true
        type: choice
        options:
          - 'snapshots'
          - '24.10.0'
          - '23.05.5'
        default: '24.10.0'
      target:
        description: '目标平台 (target/subtarget)'
        required: true
        type: choice
        options:
          - 'x86/64'
          - 'x86/generic'
          - 'x86/legacy'
          - 'x86/geode'
          - 'armsr/armv8'
          - 'armsr/armv7'
          - 'ath79/generic'
          - 'ath79/nand'
          - 'ipq40xx/generic'
          - 'ipq806x/generic'
          - 'mediatek/filogic'
          - 'mediatek/mt7622'
          - 'rockchip/armv8'
          - 'bcm27xx/bcm2712'
          - 'bcm27xx/bcm2711'
          - 'bcm27xx/bcm2710'
          - 'mvebu/cortexa72'
          - 'sunxi/cortexa53'
        default: 'x86/64'
      profile:
        description: '目标设备 Profile（x86 通常用 generic）'
        required: false
        type: string
        default: 'generic'
      packages:
        description: '额外安装的软件包（空格分隔）'
        required: false
        type: string
        default: 'luci luci-i18n-base-zh-cn nano htop curl'
      rootfs_size:
        description: 'RootFS 分区大小 (MB)，留空使用默认'
        required: false
        type: string
        default: '1024'

permissions:
  contents: write

jobs:
  build:
    name: 'IB: ${{ inputs.openwrt_version }} / ${{ inputs.target }}'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract ImageBuilder
        run: |
          VERSION="${{ inputs.openwrt_version }}"
          TARGET="${{ inputs.target }}"
          TARGET_SAFE="${TARGET//\//-}"

          if [ "$VERSION" = "snapshots" ]; then
            BASE="https://downloads.openwrt.org/snapshots/targets/${TARGET}"
            NAME="openwrt-imagebuilder-${TARGET_SAFE}.Linux-x86_64"
          else
            BASE="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}"
            NAME="openwrt-imagebuilder-${VERSION}-${TARGET_SAFE}.Linux-x86_64"
          fi

          # Try .zst first (newer), fall back to .xz
          echo ">> Downloading $BASE/$NAME.tar.zst"
          if curl -fL "$BASE/$NAME.tar.zst" -o ib.tar.zst 2>/dev/null; then
            tar --zstd -xf ib.tar.zst 2>/dev/null || tar -xf ib.tar.zst
          else
            echo ">> .zst not available, trying .xz..."
            curl -fL "$BASE/$NAME.tar.xz" -o ib.tar.xz
            tar -xf ib.tar.xz
          fi

          IB_DIR=$(ls -d openwrt-imagebuilder-* 2>/dev/null | head -1)
          [ -z "$IB_DIR" ] && { echo "::error::ImageBuilder extraction failed"; ls -la; exit 1; }
          echo "IB_DIR=$IB_DIR" >> $GITHUB_ENV
          echo ">> ImageBuilder: $IB_DIR"

      - name: Prepare Custom Files
        run: |
          if [ -d files ] && [ "$(ls -A files 2>/dev/null)" ]; then
            echo "FILES_PATH=${{ github.workspace }}/files" >> $GITHUB_ENV
            echo ">> Custom files: $(find files -type f | wc -l) files"
          else
            mkdir -p /tmp/empty-files
            echo "FILES_PATH=/tmp/empty-files" >> $GITHUB_ENV
            echo ">> No custom files"
          fi

      - name: Assemble Firmware Image
        working-directory: ${{ env.IB_DIR }}
        run: |
          CMD="make image"
          [ -n "${{ inputs.profile }}" ]    && CMD="$CMD PROFILE=\"${{ inputs.profile }}\""
          [ -n "${{ inputs.packages }}" ]   && CMD="$CMD PACKAGES=\"${{ inputs.packages }}\""
          [ -n "${{ inputs.rootfs_size }}" ] && CMD="$CMD ROOTFS_PARTSIZE=\"${{ inputs.rootfs_size }}\""
          [ -n "$FILES_PATH" ] && [ -d "$FILES_PATH" ] && CMD="$CMD FILES=\"$FILES_PATH\""

          echo ">> $CMD"
          eval "$CMD"
          echo ">> Output:"
          find bin/ -type f \( -name "*.img.gz" -o -name "*.vmdk" -o -name "*.vdi" -o -name "*.iso" -o -name "*-squashfs-*" \) -exec ls -lh {} \;

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_${{ inputs.openwrt_version }}_${{ inputs.target }}_${{ github.run_number }}
          path: ${{ env.IB_DIR }}/bin/targets/
          retention-days: 90
