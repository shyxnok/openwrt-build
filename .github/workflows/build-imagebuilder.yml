name: Build OpenWrt (ImageBuilder — Fast)

# =============================================================================
# Fast ImageBuilder workflow — downloads pre-built OpenWrt ImageBuilder for your
# target and assembles a custom firmware image with your chosen packages.
# Best for: quick iteration (adding/removing packages), testing configs.
# Duration: 15–30 minutes.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本'
        required: true
        type: choice
        options:
          - 'snapshots'
          - '24.10.0'
          - '23.05.5'
        default: '24.10.0'
      target:
        description: '目标平台 (target/subtarget)'
        required: true
        type: choice
        options:
          - 'x86/64'
          - 'x86/generic'
          - 'x86/legacy'
          - 'x86/geode'
          - 'armsr/armv8'
          - 'armsr/armv7'
          - 'ath79/generic'
          - 'ath79/nand'
          - 'ipq40xx/generic'
          - 'ipq806x/generic'
          - 'mediatek/filogic'
          - 'mediatek/mt7622'
          - 'rockchip/armv8'
          - 'bcm27xx/bcm2712'
          - 'bcm27xx/bcm2711'
          - 'bcm27xx/bcm2710'
          - 'mvebu/cortexa72'
          - 'sunxi/cortexa53'
        default: 'x86/64'
      profile:
        description: '目标设备 Profile（留空使用 target 默认）如: generic, netgear_wndr4300'
        required: false
        type: string
        default: ''
      packages:
        description: '额外安装的软件包（空格分隔）如: luci luci-i18n-base-zh-cn nano htop curl'
        required: false
        type: string
        default: 'luci luci-i18n-base-zh-cn nano htop curl'
      disable_services:
        description: '禁用的启动服务（空格分隔）如: dnsmasq firewall'
        required: false
        type: string
        default: ''
      rootfs_size:
        description: 'RootFS 分区大小 (MB)'
        required: false
        type: string
        default: '512'
      custom_files:
        description: '包含自定义文件的目录路径（留空使用仓库中的 files/ 目录）'
        required: false
        type: string
        default: 'files'

permissions:
  contents: write

jobs:
  build:
    name: 'IB: ${{ inputs.openwrt_version }} / ${{ inputs.target }}'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Build Variables
        id: vars
        run: |
          TARGET="${{ inputs.target }}"
          echo "TARGET_SAFE=${TARGET//\//-}" >> $GITHUB_ENV
          BRANCH="${{ inputs.openwrt_version }}"
          if [ "$BRANCH" = "snapshots" ]; then
            echo "BRANCH=snapshots" >> $GITHUB_ENV
          else
            echo "BRANCH=$(echo "$BRANCH" | grep -oE '^[0-9]+\.[0-9]+')" >> $GITHUB_ENV
          fi

      - name: Build Firmware with ImageBuilder
        uses: fantastic-packages/gh-action-imagebuilder@master
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.openwrt_version }}
          PROFILE: ${{ inputs.profile }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          PACKAGES: ${{ inputs.packages }}
          DISABLED_SERVICES: ${{ inputs.disable_services }}
          ROOTFS_SIZE: ${{ inputs.rootfs_size }}

      - name: Verify Built Images
        run: |
          echo ">> Built firmware images:"
          find artifacts/bin/targets/ -type f \( \
            -name "*.img.gz" -o -name "*.vmdk" -o -name "*.vdi" \
            -o -name "*.iso" -o -name "*.tar.gz" -o -name "*-squashfs-*" \
            -o -name "*.itb" -o -name "*.bin" \) \
            | head -30
          echo "---"
          echo ">> Image sizes:"
          find artifacts/bin/targets/ -type f \( \
            -name "*.img.gz" -o -name "*.vmdk" -o -name "*.vdi" \
            -o -name "*.iso" -o -name "*.tar.gz" \) \
            -exec ls -lh {} \;

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_${{ inputs.openwrt_version }}_${{ env.TARGET_SAFE }}_${{ github.run_number }}
          path: artifacts/bin/targets/${{ inputs.target }}/
          retention-days: 90

      - name: Upload to Release
        if: inputs.openwrt_version == 'snapshots'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ env.TARGET_SAFE }}-${{ github.run_number }}
          name: 'Snapshot: ${{ inputs.target }} (Build #${{ github.run_number }})'
          body: |
            ## Snapshot 固件

            - **目标**: ${{ inputs.target }}
            - **额外包**: ${{ inputs.packages }}
          files: |
            artifacts/bin/targets/${{ inputs.target }}/*
          draft: false
          prerelease: true
