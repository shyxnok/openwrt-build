name: Build OpenWrt (Full Source Compilation)

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'OpenWrt 源码仓库地址'
        required: false
        type: string
        default: 'https://github.com/openwrt/openwrt'
      repo_branch:
        description: '分支或 Tag（如 main, v24.10.0, openwrt-24.10）'
        required: false
        type: string
        default: 'main'
      config_file:
        description: '.config 文件路径（相对于仓库根目录）'
        required: false
        type: string
        default: 'configs/x86-64.config'
      extra_packages:
        description: '额外安装的包（空格分隔）'
        required: false
        type: string
        default: ''
      upload_release:
        description: '上传到 GitHub Release'
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '0 20 * * 5'

  push:
    paths:
      - 'configs/**'
      - 'feeds.conf'
      - 'scripts/**'
      - 'files/**'
      - '.github/workflows/build-full.yml'

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build ${{ github.event.inputs.config_file || 'configs/x86-64.config' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Custom Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Step 0 — 安装编译依赖（Ubuntu 24.04 适配版）
      # -------------------------------------------------------------------

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            fastjar flex gawk gcc-multilib g++-multilib gettext genisoimage \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev \
            libfuse-dev libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libgnutls28-dev libncurses-dev libpython3-dev libreadline-dev \
            libssl-dev libtool libyaml-dev lld llvm lrzsz msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-ply python3-pyelftools python3-setuptools python3-venv \
            qemu-utils quilt re2c rsync scons squashfs-tools subversion swig \
            texinfo unzip upx-ucl vim wget xmlto xxd zlib1g-dev zstd
          # Optional: try to install packages that may not exist on 24.04
          sudo apt-get install -y ecj libecj-java uglifyjs 2>/dev/null || true
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"
          echo ">> Dependencies OK. gcc: $(gcc --version | head -1)"

      # -------------------------------------------------------------------
      # Step 1 — 释放磁盘空间（在依赖之后执行，避免误删工具）
      # -------------------------------------------------------------------

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # -------------------------------------------------------------------
      # Step 2 — 缓存恢复
      # -------------------------------------------------------------------

      - name: Restore ccache Cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.event.inputs.repo_branch || 'main' }}

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z

      # -------------------------------------------------------------------
      # Step 3 — 克隆 OpenWrt 源码
      # -------------------------------------------------------------------

      - name: Clone OpenWrt Source
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/openwrt/openwrt' }}"
          REPO_BRANCH="${{ github.event.inputs.repo_branch || 'main' }}"
          echo ">> Cloning $REPO_URL ($REPO_BRANCH) ..."
          git clone "$REPO_URL" -b "$REPO_BRANCH" --depth=1 openwrt
          echo ">> Clone complete. Source size: $(du -sh openwrt/ | cut -f1)"

      # -------------------------------------------------------------------
      # Step 4 — 应用自定义配置
      # -------------------------------------------------------------------

      - name: Apply Custom Feeds Configuration
        run: |
          if [ -f feeds.conf ]; then
            echo ">> Using custom feeds.conf"
            cp feeds.conf openwrt/feeds.conf.default
          else
            echo ">> No custom feeds.conf found, using defaults"
          fi

      - name: Run DIY Part 1 (Pre-Feed Modify Source)
        run: |
          if [ -x scripts/diy-part1.sh ]; then
            echo ">> Running diy-part1.sh ..."
            bash scripts/diy-part1.sh
          else
            echo ">> diy-part1.sh not found, skipping"
          fi

      - name: Copy Custom Files to OpenWrt
        run: |
          if [ -d files ] && [ "$(ls -A files 2>/dev/null)" ]; then
            echo ">> Copying custom files/ to openwrt/files/"
            cp -rf files openwrt/files
          else
            echo ">> No custom files to copy"
          fi

      # -------------------------------------------------------------------
      # Step 5 — 更新 & 安装 Feeds
      # -------------------------------------------------------------------

      - name: Update Feeds
        working-directory: openwrt
        run: ./scripts/feeds update -a

      - name: Install Feeds
        working-directory: openwrt
        run: ./scripts/feeds install -a

      # -------------------------------------------------------------------
      # Step 6 — 应用 .config
      # -------------------------------------------------------------------

      - name: Apply Custom .config
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || 'configs/x86-64.config' }}"
          if [ -f "$CONFIG_FILE" ]; then
            echo ">> Using config: $CONFIG_FILE"
            cp "$CONFIG_FILE" openwrt/.config
          else
            echo "::error::Config file '$CONFIG_FILE' not found!"
            ls -la configs/ || echo "configs/ is empty"
            exit 1
          fi

      - name: Run DIY Part 2 (Pre-Compile Config Modify)
        run: |
          if [ -x scripts/diy-part2.sh ]; then
            echo ">> Running diy-part2.sh ..."
            bash scripts/diy-part2.sh
          else
            echo ">> diy-part2.sh not found, skipping"
          fi

      - name: Apply Extra Packages
        run: |
          EXTRA_PKGS="${{ github.event.inputs.extra_packages }}"
          if [ -n "$EXTRA_PKGS" ]; then
            echo ">> Adding extra packages: $EXTRA_PKGS"
            cd openwrt
            for pkg in $EXTRA_PKGS; do
              echo "CONFIG_PACKAGE_${pkg/-/_}=y" | tr 'a-z' 'A-Z' >> .config
            done
            cd ..
          fi

      # -------------------------------------------------------------------
      # Step 7 — 准备编译
      # -------------------------------------------------------------------

      - name: Make defconfig
        id: defconfig
        working-directory: openwrt
        run: |
          echo ">> Running make defconfig..."
          make defconfig V=s
          echo ">> Selected target:"
          grep -E '^CONFIG_TARGET_[a-z]' .config | grep -v '^#\|is not set' | head -20 || true

      - name: Restore Download Cache
        id: restore-dl-cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: dl-${{ runner.os }}-${{ hashFiles('feeds.conf') }}

      - name: Download All Source Packages
        working-directory: openwrt
        run: |
          echo ">> Downloading source packages..."
          make download -j$(nproc) V=s
          echo ">> Cleaning corrupted downloads..."
          find dl -size -1024c -exec rm -v {} \;
          echo ">> dl/ size: $(du -sh dl/ | cut -f1)"

      # -------------------------------------------------------------------
      # Step 8 — 编译
      # -------------------------------------------------------------------

      - name: Compile Firmware
        id: compile
        working-directory: openwrt
        run: |
          echo ">> Starting compilation with $(nproc) threads..."
          echo ">> Disk space: $(df -h . | tail -1 | awk '{print $4}') available"
          make -j$(nproc) V=s 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::warning::First attempt failed (exit $BUILD_EXIT). Retrying with -j1 V=s..."
            make -j1 V=s 2>&1 | tee -a build.log
            BUILD_EXIT=${PIPESTATUS[0]}
            if [ $BUILD_EXIT -ne 0 ]; then
              echo "::error::Build failed with exit code $BUILD_EXIT"
              echo ">> Last 100 lines of build.log:"
              tail -100 build.log
              exit $BUILD_EXIT
            fi
          fi
          echo ">> Build succeeded!"
          DEVICE_NAME=$(grep -E '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' || echo "generic")
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Show Build Summary
        if: always()
        run: |
          echo "======================="
          echo "ccache stats:"
          ccache -s
          echo "======================="
          echo "Disk usage:"
          df -h
          du -sh openwrt/bin 2>/dev/null || echo "bin: empty"
          du -sh openwrt/dl 2>/dev/null || echo "dl: empty"
          du -sh openwrt/build_dir 2>/dev/null || echo "build_dir: empty"

      # -------------------------------------------------------------------
      # Step 9 — 保存缓存
      # -------------------------------------------------------------------

      - name: Save ccache Cache
        if: steps.compile.outputs.status == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.event.inputs.repo_branch || 'main' }}

      - name: Save Download Cache
        if: steps.compile.outputs.status == 'success'
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: dl-${{ runner.os }}-${{ hashFiles('feeds.conf') }}

      # -------------------------------------------------------------------
      # Step 10 — 上传产物
      # -------------------------------------------------------------------

      - name: Upload Firmware Artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_Firmware_${{ env.DEVICE_NAME }}_${{ github.run_number }}
          path: |
            openwrt/bin/targets/**/*.img.gz
            openwrt/bin/targets/**/*.vmdk
            openwrt/bin/targets/**/*.vdi
            openwrt/bin/targets/**/*.iso
            openwrt/bin/targets/**/*-squashfs-*
            openwrt/bin/targets/**/*.itb
            openwrt/bin/targets/**/*.bin
          retention-days: 90
          compression-level: 6

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build_Log_${{ github.run_number }}
          path: openwrt/build.log
          retention-days: 30

      # -------------------------------------------------------------------
      # Step 11 — 发布到 Release（可选）
      # -------------------------------------------------------------------

      - name: Generate Release Tag
        id: release_tag
        if: steps.compile.outputs.status == 'success' && github.event.inputs.upload_release == 'true'
        run: |
          echo "tag=$(date +'%Y.%m.%d')-build${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success' && github.event.inputs.upload_release == 'true'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: OpenWrt Firmware ${{ steps.release_tag.outputs.tag }}
          body: |
            ## OpenWrt 固件自动编译
            - **源码**: ${{ github.event.inputs.repo_url || 'https://github.com/openwrt/openwrt' }}
            - **分支**: ${{ github.event.inputs.repo_branch || 'main' }}
            - **配置文件**: ${{ github.event.inputs.config_file || 'configs/x86-64.config' }}
            - **设备**: ${{ env.DEVICE_NAME }}
          files: |
            openwrt/bin/targets/**/*.img.gz
            openwrt/bin/targets/**/*.vmdk
            openwrt/bin/targets/**/*.iso
            openwrt/bin/targets/**/*-squashfs-*
          draft: false
          prerelease: false

      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 30
          keep_minimum_runs: 5
