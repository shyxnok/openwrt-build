name: Build OpenWrt (Full Source Compilation)

# =============================================================================
# Full source compilation workflow — clones OpenWrt source, applies your custom
# configs/feeds/scripts, and compiles everything from scratch.
# Best for: deep customization (kernel config, build options, custom patches).
# Duration: 2–3 hours (first run), ~1 hour with cache hits.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'OpenWrt 源码仓库地址'
        required: false
        type: string
        default: 'https://github.com/openwrt/openwrt'
      repo_branch:
        description: '分支或 Tag（如 main, v24.10.0, openwrt-24.10）'
        required: false
        type: string
        default: 'main'
      config_file:
        description: '.config 文件路径（相对于仓库根目录，放在 configs/ 下可选）'
        required: false
        type: string
        default: 'configs/x86-64.config'
      extra_packages:
        description: '额外安装的包（空格分隔，如: luci-app-openvpn nano htop）'
        required: false
        type: string
        default: ''
      upload_release:
        description: '是否上传到 GitHub Release'
        required: false
        type: boolean
        default: false

  schedule:
    # 每周五 UTC 20:00 自动编译（北京时间周六凌晨 4:00）
    - cron: '0 20 * * 5'

  push:
    paths:
      - 'configs/**'
      - 'feeds.conf'
      - 'scripts/**'
      - 'files/**'
      - '.github/workflows/build-full.yml'

env:
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build ${{ github.event.inputs.config_file || 'configs/x86-64.config' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false

    steps:
      # -----------------------------------------------------------------------
      # Step 0 — 准备：检出仓库 + 释放磁盘 + 安装编译依赖
      # -----------------------------------------------------------------------

      - name: Checkout Custom Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            ecj fastjar flex gawk gcc-multilib g++-multilib gettext genisoimage \
            git gnutls-dev gperf haveged help2man intltool libc6-dev-i386 libelf-dev \
            libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-distutils python3-ply python3-pyelftools python3-setuptools \
            qemu-utils quilt re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs unzip upx-ucl vim wget xmlto xxd zlib1g-dev zstd
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"

      # -----------------------------------------------------------------------
      # Step 1 — 缓存：恢复 ccache 加速二次编译
      # -----------------------------------------------------------------------

      - name: Restore ccache Cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.event.inputs.repo_branch || 'main' }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.inputs.repo_branch || 'main' }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z

      # -----------------------------------------------------------------------
      # Step 2 — 克隆 OpenWrt 源码
      # -----------------------------------------------------------------------

      - name: Clone OpenWrt Source
        run: |
          REPO_URL="${{ github.event.inputs.repo_url || 'https://github.com/openwrt/openwrt' }}"
          REPO_BRANCH="${{ github.event.inputs.repo_branch || 'main' }}"
          echo "Cloning $REPO_URL ($REPO_BRANCH) ..."
          git clone "$REPO_URL" -b "$REPO_BRANCH" --depth=1 openwrt

      # -----------------------------------------------------------------------
      # Step 3 — 应用自定义配置
      # -----------------------------------------------------------------------

      - name: Apply Custom Feeds Configuration
        run: |
          if [ -f feeds.conf ]; then
            echo ">> Using custom feeds.conf"
            cp feeds.conf openwrt/feeds.conf.default
          else
            echo ">> No custom feeds.conf found, using OpenWrt defaults"
          fi

      - name: Run DIY Part 1 (Pre-Feed Modify Source)
        run: |
          if [ -x scripts/diy-part1.sh ]; then
            echo ">> Running diy-part1.sh ..."
            bash scripts/diy-part1.sh
          else
            echo ">> diy-part1.sh not found or not executable, skipping"
          fi

      - name: Copy Custom Files to OpenWrt
        run: |
          if [ -d files ] && [ "$(ls -A files 2>/dev/null)" ]; then
            echo ">> Copying custom files/ to openwrt/files/"
            cp -rf files openwrt/files
          else
            echo ">> No custom files to copy"
          fi

      # -----------------------------------------------------------------------
      # Step 4 — 更新 & 安装 Feeds
      # -----------------------------------------------------------------------

      - name: Update Feeds
        working-directory: openwrt
        run: ./scripts/feeds update -a

      - name: Install Feeds
        working-directory: openwrt
        run: ./scripts/feeds install -a

      # -----------------------------------------------------------------------
      # Step 5 — 应用 .config 并运行 diy-part2
      # -----------------------------------------------------------------------

      - name: Apply Custom .config
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || 'configs/x86-64.config' }}"
          if [ -f "$CONFIG_FILE" ]; then
            echo ">> Using config: $CONFIG_FILE"
            cp "$CONFIG_FILE" openwrt/.config
          else
            echo "::warning::Config file '$CONFIG_FILE' not found! Check your inputs."
            echo ">> Available config files in configs/:"
            ls -la configs/ || echo "   (configs/ directory is empty)"
          fi

      - name: Run DIY Part 2 (Pre-Compile Config Modify)
        run: |
          if [ -x scripts/diy-part2.sh ]; then
            echo ">> Running diy-part2.sh ..."
            bash scripts/diy-part2.sh
          else
            echo ">> diy-part2.sh not found or not executable, skipping"
          fi

      - name: Apply Extra Packages
        run: |
          EXTRA_PKGS="${{ github.event.inputs.extra_packages }}"
          if [ -n "$EXTRA_PKGS" ]; then
            echo ">> Adding extra packages: $EXTRA_PKGS"
            cd openwrt
            for pkg in $EXTRA_PKGS; do
              echo "CONFIG_PACKAGE_${pkg/-/_}=y" | tr 'a-z' 'A-Z' >> .config
            done
          fi

      # -----------------------------------------------------------------------
      # Step 6 — 准备编译
      # -----------------------------------------------------------------------

      - name: Make defconfig
        working-directory: openwrt
        run: make defconfig

      - name: Show Target Summary
        working-directory: openwrt
        run: |
          echo "============= Build Target ============="
          grep -E '^CONFIG_TARGET_[A-Z]+=y' .config || echo "(target not set)"
          grep -E '^CONFIG_TARGET_[A-Z]+_' .config || true
          echo "========================================="

      - name: Restore Download Cache
        id: restore-dl-cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: dl-${{ runner.os }}-${{ hashFiles('feeds.conf') }}-${{ hashFiles(format('{0}', github.event.inputs.config_file || 'configs/x86-64.config')) }}

      - name: Download All Source Packages
        working-directory: openwrt
        run: |
          make download -j$(nproc) V=s
          # Remove corrupted downloads (files smaller than 1KB)
          find dl -size -1024c -exec rm -f {} \;

      # -----------------------------------------------------------------------
      # Step 7 — 编译
      # -----------------------------------------------------------------------

      - name: Compile Firmware
        id: compile
        working-directory: openwrt
        env:
          PATH: /usr/lib/ccache:${{ env.PATH }}
        run: |
          echo ">> Starting compilation with $(nproc) threads"
          make -j$(nproc) V=s 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log
          echo "status=success" >> $GITHUB_OUTPUT
          # Extract device name from .config
          DEVICE_NAME=$(grep -E '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' || echo "unknown")
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          echo ">> Build complete for device: $DEVICE_NAME"

      - name: ccache Statistics
        if: always()
        run: |
          ccache -s
          echo "======================="
          echo "Disk usage summary:"
          echo "======================="
          df -h
          echo "---"
          du -sh openwrt/bin 2>/dev/null || echo "bin: not found"
          du -sh openwrt/dl 2>/dev/null || echo "dl: not found"

      # -----------------------------------------------------------------------
      # Step 8 — 保存缓存（仅限默认分支或手动触发）
      # -----------------------------------------------------------------------

      - name: Save ccache Cache
        if: steps.restore-cache.outputs.cache-hit != 'true' && steps.compile.outputs.status == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.event.inputs.repo_branch || 'main' }}-${{ github.run_id }}

      - name: Save Download Cache
        if: steps.restore-dl-cache.outputs.cache-hit != 'true' && steps.compile.outputs.status == 'success'
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: dl-${{ runner.os }}-${{ hashFiles('feeds.conf') }}-${{ hashFiles(format('{0}', github.event.inputs.config_file || 'configs/x86-64.config')) }}

      # -----------------------------------------------------------------------
      # Step 9 — 上传产物
      # -----------------------------------------------------------------------

      - name: Organize Firmware Files
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          mkdir -p artifact
          # Remove packages subdirectory (intermediate .ipk files, not needed)
          rm -rf $(find openwrt/bin/targets -type d -name "packages" 2>/dev/null)
          # Copy firmware files
          cp -r openwrt/bin/targets artifact/
          echo ">> Firmware files:"
          find artifact -type f -name "*.img.gz" -o -name "*.vmdk" -o -name "*.vdi" \
            -o -name "*.iso" -o -name "*.tar.gz" -o -name "*-squashfs-*" \
            -o -name "*.itb" -o -name "*.bin" \
            | head -30

      - name: Upload Firmware Artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_Firmware_${{ env.DEVICE_NAME }}_${{ github.run_number }}
          path: artifact/targets/
          retention-days: 90
          compression-level: 6

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build_Log_${{ github.run_number }}
          path: openwrt/build.log
          retention-days: 30

      # -----------------------------------------------------------------------
      # Step 10 — 发布到 GitHub Release（可选）
      # -----------------------------------------------------------------------

      - name: Generate Release Tag
        id: release_tag
        if: steps.compile.outputs.status == 'success' && github.event.inputs.upload_release == 'true'
        run: |
          TAG="$(date +'%Y.%m.%d')-build${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo ">> Release tag: $TAG"

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success' && github.event.inputs.upload_release == 'true'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: OpenWrt Firmware ${{ steps.release_tag.outputs.tag }}
          body: |
            ## OpenWrt 固件自动编译

            - **源码**: ${{ github.event.inputs.repo_url || 'https://github.com/openwrt/openwrt' }}
            - **分支**: ${{ github.event.inputs.repo_branch || 'main' }}
            - **配置文件**: ${{ github.event.inputs.config_file || 'configs/x86-64.config' }}
            - **编译时间**: ${{ github.event.repository.updated_at }}
            - **设备**: ${{ env.DEVICE_NAME }}

            ### 使用说明
            刷写固件前请先备份当前配置。默认路由器地址: `192.168.1.1`
          files: |
            artifact/targets/**/*.img.gz
            artifact/targets/**/*.vmdk
            artifact/targets/**/*.iso
            artifact/targets/**/*-squashfs-*
          draft: false
          prerelease: false

      # -----------------------------------------------------------------------
      # Step 11 — 清理旧工件
      # -----------------------------------------------------------------------

      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 30
          keep_minimum_runs: 5
