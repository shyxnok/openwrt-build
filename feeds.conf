# =============================================================================
# OpenWrt Feeds Configuration
# =============================================================================
# 此文件会在编译时覆盖 OpenWrt 默认的 feeds.conf.default。
# 取消注释即可启用对应的第三方软件源。
# =============================================================================

# ---- 官方源（默认包含，无需取消注释）----
src-git packages https://git.openwrt.org/feed/packages.git;main
src-git luci https://git.openwrt.org/project/luci.git;main
src-git routing https://git.openwrt.org/feed/routing.git;main
src-git telephony https://git.openwrt.org/feed/telephony.git;main

# ---- 第三方源（取消注释以启用）----

# Hello World（包含 SSR/SS/Trojan/V2Ray 等）
# src-git helloworld https://github.com/fw876/helloworld.git;master

# OpenClash
# src-git openclash https://github.com/vernesong/OpenClash.git;master

# PassWall（科学上网）
# src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main
# src-git passwall2 https://github.com/xiaorouji/openwrt-passwall2.git;main
# src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main

# SSR Plus+
# src-git ssrplus https://github.com/fw876/helloworld.git;master

# MosDNS
# src-git mosdns https://github.com/sbwml/luci-app-mosdns.git;v5

# 其他实用工具
# src-git kenzo https://github.com/kenzok8/openwrt-packages.git;master
# src-git small https://github.com/kenzok8/small.git;master
# src-git immortalwrt https://github.com/immortalwrt/packages.git;master
